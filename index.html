<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>챔퍼스 할로윈 부스</title>
  <meta name="description" content="아주대 기독교 봉사 동아리 챔퍼스 할로윈 부스 — 활동 신청하고 핫초코 받아 가!">
  <meta name="theme-color" content="#FFFBF2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131A2C" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎃%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800;900&family=Noto+Sans+KR:wght@500;700&display=swap">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <button class="icon-btn" id="backBtn" type="button" aria-label="이전으로" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="progress" role="progressbar" aria-label="진행도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="prog"><div class="fill" id="fill"></div></div>
      <div class="pill" id="pill"></div>
    </header>

    <main class="stage" id="stage"></main>

    <footer class="bottom" id="bottom">
      <p class="bottom-chip" id="bottomChip" hidden></p>
      <p class="bottom-sub" id="bottomSub" hidden></p>
      <button class="btn" id="nextBtn" type="button"></button>
      <button class="link-btn" id="linkBtn" type="button" hidden></button>
    </footer>

    <div class="banner" id="banner" role="status" aria-live="polite" hidden>
      <div class="banner-row">
        <div class="banner-icon" id="bannerIcon" aria-hidden="true">✓</div>
        <div>
          <div class="banner-title" id="bannerTitle"></div>
          <div class="banner-sub" id="bannerSub"></div>
        </div>
      </div>
      <button class="btn" id="contBtn" type="button"></button>
    </div>
  </div>
  <div id="sheetRoot"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
